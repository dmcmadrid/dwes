<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario (UD4, diapositiva 7)</title>
</head>
<body>
<!-- Diapositiva 7: el formulario envía los datos por GET a formulario.php -->
<form action="formulario.php" method="GET">
    <p><label for="nombre">Nombre del alumno:</label>
        <input type="text" name="nombre" id="nombre" value="" />
    </p>

    <!-- Los dos checkbox comparten name="modulos[]": los corchetes hacen que
         PHP reciba un ARRAY con todos los marcados (diapositiva 9) -->
    <p><input type="checkbox" name="modulos[]" id="modulosDWES" value="DWES" />
        <label for="modulosDWES">Desarrollo web en entorno servidor</label>
    </p>

    <p><input type="checkbox" name="modulos[]" id="modulosDWEC" value="DWEC" />
        <label for="modulosDWEC">Desarrollo web en entorno cliente</label>
    </p>

    <input type="submit" value="Enviar" name="enviar" />
</form>
</body>
</html>
